<!DOCTYPE html>
<html>
<head>
    <title>Test Page</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        .question-box {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .question-box p {
            font-weight: bold;
        }

        label {
            display: block;
            margin: 5px 0;
            cursor: pointer;
        }

        button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }
    </style>
</head>

<body>

<h2>🧠 MCQ Test</h2>

<form action="/submit" method="POST">

    {% for q in questions %}

    <div class="question-box">

        <p>Q{{ loop.index }}. {{ q.question }}</p>

        <!-- OPTION A -->
        <label>
            <input type="radio" name="q{{ loop.index0 }}" value="0" required>
            A. {{ q.options[0] }}
        </label>

        <!-- OPTION B -->
        <label>
            <input type="radio" name="q{{ loop.index0 }}" value="1">
            B. {{ q.options[1] }}
        </label>

        <!-- OPTION C -->
        <label>
            <input type="radio" name="q{{ loop.index0 }}" value="2">
            C. {{ q.options[2] }}
        </label>

        <!-- OPTION D -->
        <label>
            <input type="radio" name="q{{ loop.index0 }}" value="3">
            D. {{ q.options[3] }}
        </label>

    </div>

    {% endfor %}

    <button type="submit">🚀 Submit Test</button>

</form>

</body>
</html>
